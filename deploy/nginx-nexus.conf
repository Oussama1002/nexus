# Nexus — Nginx site (Ubuntu/Debian + PHP-FPM)
# 1) Copy:  sudo cp /var/www/nexus/deploy/nginx-nexus.conf /etc/nginx/sites-available/nexus
# 2) Edit SERVER_IP and php8.3-fpm socket if needed
# 3) Enable: sudo ln -sf /etc/nginx/sites-available/nexus /etc/nginx/sites-enabled/
# 4) Test:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www/nexus/frontend/dist;
    index index.html;

    client_max_body_size 32M;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve Laravel storage files (avatars, logos, uploads)
    location ^~ /storage/ {
        alias /var/www/nexus/backend/storage/app/public/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Laravel API (all /api/* → index.php)
    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/nexus/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
    }
}
